# Deployment (Q8: homelab behind a Cloudflare Tunnel).
#
#   docker compose up -d              production
#   docker compose --profile dev up   development, with the dev login bypass
#
# With the server-only client data policy (R35), uptime is load-bearing rather
# than hygiene: if this container is down the app is unusable, not degraded.
# That is also why R40.8's heartbeat matters — nothing in here survives to
# report its own absence.

name: pathayam

services:
  # ---------------------------------------------------------------------------
  # Production
  # ---------------------------------------------------------------------------
  pathayam:
    build:
      context: .
      target: runtime
    image: pathayam:latest
    restart: unless-stopped
    # Bound to loopback: the tunnel reaches it, the LAN does not.
    ports:
      - "127.0.0.1:${PORT:-8080}:8080"
    volumes:
      - pathayam-data:/data
    environment:
      # Must match the public URL exactly — OAuth redirects and cookie scoping
      # both depend on it.
      BASE_URL: ${BASE_URL:?set BASE_URL in .env, e.g. https://pathayam.example.com}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}

      TRUST_PROXY: "true"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SESSION_DAYS: ${SESSION_DAYS:-30}

      # R40.4 (Q24): the one failure class where silence loses data.
      BACKUP_WEBHOOK_URL: ${BACKUP_WEBHOOK_URL:-}
      # R40.8: pinged on a *successful* verified restore. The monitor alerts on
      # the ping's absence, which is the only way this box being down can raise
      # an alarm — see 10 §3.2.
      HEARTBEAT_URL: ${HEARTBEAT_URL:-}

      # 07 §6.4: only needed for direct equities. Q16 settled that this
      # portfolio is mostly mutual funds, and MFAPI needs no key — so leaving
      # this empty is the expected configuration, not a missing one (P9).
      ALPHA_VANTAGE_KEY: ${ALPHA_VANTAGE_KEY:-}
      # Seals stored credentials (your own Google client secret, Gmail refresh
      # tokens). At least 32 characters: openssl rand -base64 32. Keep it out of
      # the data volume; losing it means reconnecting Gmail, nothing more.
      SECRETS_KEY: ${SECRETS_KEY:-}

      # PLAN-1: which modules this instance offers, and its limits. PLAN picks
      # a preset (selfhost, solo, household, power); anything below that is
      # set in .env wins over it, and anything left unset takes the preset's
      # value. The table is in docs/operations.md, "Plans and modules".
      PLAN: ${PLAN:-}
      MAX_MEMBERS: ${MAX_MEMBERS:-}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-}
      FEATURE_LOANS: ${FEATURE_LOANS:-}
      FEATURE_FAMILY_LOANS: ${FEATURE_FAMILY_LOANS:-}
      FEATURE_ASSETS: ${FEATURE_ASSETS:-}
      FEATURE_DEPOSITS: ${FEATURE_DEPOSITS:-}
      FEATURE_INSURANCE: ${FEATURE_INSURANCE:-}
      FEATURE_GOALS: ${FEATURE_GOALS:-}
      FEATURE_TAX: ${FEATURE_TAX:-}
      FEATURE_REPORTS: ${FEATURE_REPORTS:-}
      FEATURE_SCHEDULES: ${FEATURE_SCHEDULES:-}
      FEATURE_RULES: ${FEATURE_RULES:-}
      FEATURE_ATTACHMENTS: ${FEATURE_ATTACHMENTS:-}
      FEATURE_IMPORT_CSV: ${FEATURE_IMPORT_CSV:-}
      FEATURE_IMPORT_PDF: ${FEATURE_IMPORT_PDF:-}
      FEATURE_IMPORT_BUDGET_APP: ${FEATURE_IMPORT_BUDGET_APP:-}
      FEATURE_GMAIL: ${FEATURE_GMAIL:-}
      # Members (or the household) bring their own Google OAuth client for
      # Gmail. On in every preset; needs SECRETS_KEY to store the secret.
      FEATURE_GMAIL_BYO: ${FEATURE_GMAIL_BYO:-}
      FEATURE_API_TOKENS: ${FEATURE_API_TOKENS:-}
      FEATURE_AI: ${FEATURE_AI:-}
      # Q18 settled on rupee-only accounts; off in every preset.
      FEATURE_MULTI_CURRENCY: ${FEATURE_MULTI_CURRENCY:-}

      # DEV_LOGIN is deliberately absent. The bypass is not in this image at
      # all (R38.5), and the app refuses to start if it is enabled anywhere
      # production-shaped (R38.3).
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  # ---------------------------------------------------------------------------
  # Development — docker compose --profile dev up
  #
  # Source is mounted and Node watches it, so an edit restarts the server
  # without a rebuild. DEV_LOGIN is safe here only because BASE_URL is
  # localhost and no real OAuth credentials are set; config.ts refuses to start
  # if either of those changes (R38.3).
  # ---------------------------------------------------------------------------
  dev:
    profiles: ["dev"]
    build:
      context: .
      target: dev
    command: ["npm", "run", "dev"]
    restart: unless-stopped
    ports:
      - "${DEV_PORT:-8080}:8080"
    volumes:
      - ./src:/app/src:ro
      - dev-data:/data
    environment:
      NODE_ENV: development
      BASE_URL: http://localhost:${DEV_PORT:-8080}
      DEV_LOGIN: "true"
      LOG_LEVEL: debug
      DATA_DIR: /data

  # One-shot: docker compose --profile seed up seed
  seed:
    profiles: ["seed"]
    build:
      context: .
      target: dev
    command: ["npm", "run", "seed"]
    volumes:
      - ./src:/app/src:ro
      - dev-data:/data
    environment:
      NODE_ENV: development
      DATA_DIR: /data

  # One-shot: docker compose --profile test up test
  test:
    profiles: ["test"]
    build:
      context: .
      target: dev
    command: ["sh", "-c", "npm test && npm run typecheck"]
    # verify_docs.py runs on the host — the image carries no Python, and the
    # docs are not copied into it.
    volumes:
      - ./src:/app/src:ro

volumes:
  pathayam-data:
  dev-data:
