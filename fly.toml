# Fly.io configuration for the public demo at demo.pathayam.app.
#
# The demo is the `demo` stage of the Dockerfile: a seeded SQLite database baked
# into the image, in DEMO_MODE, with no sign-in. Every visitor shares one
# machine and one database, and a restart resets it to the image's copy — so
# nothing a visitor types outlives the instance and there is no reseed job to
# forget.
#
#   fly deploy            # from here
#   .github/workflows/fly.yml deploys the same thing on every push to main.

app = 'pathayam-demo'
primary_region = 'iad'

[build]
  # Without this Fly would build the default (last) stage, which happens to be
  # `demo` today but would silently become whatever is appended tomorrow. The
  # `runtime` stage has no seeded database and no DEMO_MODE, so picking the
  # wrong one produces a sign-in page rather than a demo.
  build-target = "demo"

[env]
  DEMO_MODE = "1"
  DATABASE_PATH = "/app/demo.sqlite"
  BASE_URL = "https://demo.pathayam.app"
  PORT = "8080"

  # Fly terminates TLS at its proxy and forwards plain HTTP to the machine.
  # Without this the app reads its own origin off the socket, decides it is
  # http://, and rejects every POST as cross-origin against the browser's
  # https:// Origin header. The demo would load and then refuse every button.
  TRUST_PROXY = "1"

[http_service]
  internal_port = 8080
  force_https = true
  # The demo is idle most of the time. Fly stops the machine when it is and
  # starts it on the next request, so it bills for seconds of use rather than
  # a month of uptime. The first request after a sleep pays about a second of
  # cold start.
  # On demand, never always-on. Fly stops the machine when it goes idle and
  # starts it again on the next request, so an idle demo bills for nothing but
  # its root filesystem. The first visitor after a quiet spell pays roughly a
  # second of cold start.
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  # Exactly one machine, and the count is not expressed here — it is `fly scale
  # count 1`, already set. What keeps it at one is `--ha=false` on every deploy
  # (see .github/workflows/fly.yml); without it Fly creates a spare for high
  # availability. A spare would be actively wrong here: the database is baked
  # into the image rather than shared over a volume, so two machines are two
  # different databases, and a visitor would see their own transaction or not
  # depending on which one answered.

  # One machine, one SQLite file, server-rendered pages. These caps make it
  # queue under a burst instead of thrashing a 256 MB VM.
  [http_service.concurrency]
    type = 'requests'
    soft_limit = 25
    hard_limit = 50

  # /healthz opens the database and reports the schema version, so a machine
  # that boots but cannot read its database fails the check instead of serving
  # errors.
  [[http_service.checks]]
    method = 'GET'
    path = '/healthz'
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'

# Measured on the deployed machine under a burst of concurrent report renders:
# Node peaked at 125 MB resident against the 207 MB a 256 MB VM actually leaves
# after kernel overhead. That fits, but a Firecracker VM has no swap, so
# overshooting is a kill rather than a slowdown — and Node sizes its heap from
# total system memory, so it grows into whatever gap it is shown before
# collecting. At 512 MB the machine reports 459 MB usable, which is 3.6× the
# measured peak.
#
# Idle cost is unchanged by this: the machine is stopped when nobody is looking,
# so it is billed per second of actual use rather than per month of uptime.
[[vm]]
  memory = '512mb'
  cpus = 1
