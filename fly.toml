# Fly.io configuration for the public demo at demo.pathayam.app.
#
# The demo is the `demo` stage of the Dockerfile: a seeded SQLite database baked
# into the image, in DEMO_MODE, with no sign-in. Every visitor shares one
# machine and one database, and a restart resets it to the image's copy — so
# nothing a visitor types outlives the instance and there is no reseed job to
# forget.
#
#   fly deploy            # from here
#   .github/workflows/fly.yml deploys the same thing on every push to main.

app = 'pathayam-demo'
primary_region = 'iad'

[build]
  # Without this Fly would build the default (last) stage, which happens to be
  # `demo` today but would silently become whatever is appended tomorrow. The
  # `runtime` stage has no seeded database and no DEMO_MODE, so picking the
  # wrong one produces a sign-in page rather than a demo.
  build-target = "demo"

[env]
  DEMO_MODE = "1"
  DATABASE_PATH = "/app/demo.sqlite"
  BASE_URL = "https://demo.pathayam.app"
  PORT = "8080"

  # Fly terminates TLS at its proxy and forwards plain HTTP to the machine.
  # Without this the app reads its own origin off the socket, decides it is
  # http://, and rejects every POST as cross-origin against the browser's
  # https:// Origin header. The demo would load and then refuse every button.
  TRUST_PROXY = "1"

[http_service]
  internal_port = 8080
  force_https = true
  # The demo is idle most of the time. Fly stops the machine when it is and
  # starts it on the next request, so it bills for seconds of use rather than
  # a month of uptime. The first request after a sleep pays about a second of
  # cold start.
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

  # One machine, one SQLite file, server-rendered pages. These caps make it
  # queue under a burst instead of thrashing a 256 MB VM.
  [http_service.concurrency]
    type = 'requests'
    soft_limit = 25
    hard_limit = 50

  # /healthz opens the database and reports the schema version, so a machine
  # that boots but cannot read its database fails the check instead of serving
  # errors.
  [[http_service.checks]]
    method = 'GET'
    path = '/healthz'
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'

[[vm]]
  memory = '256mb'
  cpus = 1
