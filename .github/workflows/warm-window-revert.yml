name: End the warm window

# One-shot and self-deleting. The demo was put on min_machines_running = 1 for
# a 72-hour launch window on 2026-09-18; this puts it back to 0 at the end of
# it, deploys, and then removes itself and the file it restores.
#
# It lives here rather than in a local `at` job or a Claude session because
# neither survives three days reliably. This runs on GitHub's schedule with the
# FLY_API_TOKEN that already deploys the demo, whether or not any particular
# machine is switched on.
#
# The reverted fly.toml is committed whole at .github/fly-on-demand.toml and
# simply copied over, rather than edited in place by a script here. A revert
# that silently mangles the config is worse than no revert.
#
# 2026-09-20 20:53 UTC = 2026-09-21 02:23 IST. GitHub's scheduler often runs a
# few minutes late; for this, late is fine.
on:
  schedule:
    - cron: '53 20 20 9 *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  revert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Put the demo back on demand
        id: revert
        run: |
          if ! grep -q 'min_machines_running = 1' fly.toml; then
            echo "Already on demand — nothing to do."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cp .github/fly-on-demand.toml fly.toml
          grep -n 'min_machines_running' fly.toml
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit, and clear away both halves of this
        if: steps.revert.outputs.changed == 'true'
        run: |
          rm .github/workflows/warm-window-revert.yml .github/fly-on-demand.toml
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Demo: warm window over, back on demand" \
                     -m "The 72-hour launch window has ended, so min_machines_running returns to 0 and the machine sleeps when nobody is looking again. Removes the workflow and the stashed config that did it; both had exactly one job."
          git push

      # Deploying here rather than leaving it to fly.yml: a push made with
      # GITHUB_TOKEN deliberately does not trigger other workflows, so nothing
      # else would pick this change up.
      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: steps.revert.outputs.changed == 'true'
      - run: flyctl deploy --remote-only --ha=false
        if: steps.revert.outputs.changed == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
