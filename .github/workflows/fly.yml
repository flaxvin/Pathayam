name: Deploy demo

# demo.pathayam.app is the `demo` stage of the Dockerfile running on Fly.io.
# This deploys it whenever the application changes on main.
#
# One-time setup, in the repository: Settings → Secrets and variables →
# Actions → New repository secret, named FLY_API_TOKEN. Create the token with
# `fly tokens create deploy -a pathayam-demo` — a deploy token is scoped to
# this one app and cannot touch the rest of the account.
#
# It also runs every Wednesday at 04:00 IST (22:30 UTC on Tuesday), which
# rebuilds the image and so re-seeds the demo with data that ends that day.
# The demo already resets to its seed on every wake from idle; this keeps the
# seed itself from going stale between releases. GitHub may start a scheduled
# run some minutes late, and disables schedules in a repository with no
# activity for 60 days — re-enable it from the Actions tab if that happens.

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'assets/**'
      - 'Dockerfile'
      - 'fly.toml'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.github/workflows/fly.yml'
  schedule:
    - cron: '30 22 * * 2'
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time, and never cancel one half-done — a cancelled deploy can
# leave the app on a half-replaced machine.
concurrency:
  group: fly-demo
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      # The app ships no runtime dependency, but typecheck needs TypeScript and
      # it is a devDependency — so this is not the no-op it looks like.
      - run: npm ci
      - run: npm run typecheck

      # `npm test` alone reports "Process completed with exit code 1" and
      # nothing else to anyone without repository access — the step log needs a
      # token, while job annotations do not. A failure here is usually being
      # read by whoever just pushed, so the names of the failing tests are
      # raised as annotations where they can actually be seen.
      - name: Test
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.txt && exit 0
          status=$?
          echo "::group::Failing tests"
          grep -E '^ *not ok |^ *✖ ' test-output.txt | head -40 || true
          echo "::endgroup::"
          while IFS= read -r line; do
            echo "::error::$line"
          done < <(grep -E '^ *✖ ' test-output.txt | sed 's/^ *✖ //' \
                   | grep -v '^failing tests:' | sort -u | head -20)
          exit $status

  deploy:
    needs: test
    runs-on: ubuntu-latest
    # A deploy that hangs holds the concurrency group, and every later run
    # queues behind it and is cancelled by the one after that — so the demo
    # silently stops deploying while every run still reports "pending". That
    # happened: a deploy sat in progress for over an hour, most likely waiting
    # on a Fly lease held by a deploy run by hand at the same time. A bounded
    # job fails instead, and releases the group.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # The demo database is seeded into the image at build time and is public,
      # so it must contain nothing but the fictional seed. This refuses to ship
      # an image whose demo seed reaches for a real mailbox or a stored
      # statement identity — the app refuses to start on such a database, and
      # finding that out at deploy time is cheaper than at boot.
      - name: Refuse to deploy a demo that is not in demo mode
        run: |
          if ! grep -q 'build-target = "demo"' fly.toml; then
            echo "::error::fly.toml lost build-target=\"demo\" — this would deploy the sign-in image, not the demo."
            exit 1
          fi
          if ! grep -q 'TRUST_PROXY' fly.toml; then
            echo "::error::TRUST_PROXY is unset — every POST behind Fly's proxy would be refused as cross-origin."
            exit 1
          fi
          echo "fly.toml carries the demo target and the proxy setting."

      - uses: superfly/flyctl-actions/setup-flyctl@master

      # --ha=false keeps this at one machine. Fly's default is to create a
      # spare for high availability, which would be wrong here: the demo
      # database is baked into the image, not shared over a volume, so a second
      # machine is a second database and a visitor would see their own
      # transaction or not depending on which answered.
      # --wait-timeout bounds the part that actually waits (machines becoming
      # healthy), so the step fails with a reason rather than sitting there.
      # SEED_STAMP changes on every run, so the demo is re-seeded even when
      # Docker could otherwise reuse the cached layer — see the Dockerfile.
      - run: flyctl deploy --remote-only --ha=false --wait-timeout=600 --build-arg SEED_STAMP=${{ github.run_id }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
